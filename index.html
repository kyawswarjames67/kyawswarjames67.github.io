<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Love Surprise ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.25);
      max-width: 400px;
      width: 100%;
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .envelope-icon {
      font-size: 65px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      display: inline-block;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      color: #e63946;
      font-size: 24px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 48px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
    }

    .btn-primary:hover {
      background: #e63946;
      transform: scale(1.05);
    }

    .btn-secondary {
      background: #f1f1f1;
      color: #666;
    }

    .hidden {
      display: none;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      color: #ff4d6d;
      animation: floatUp 4s linear forwards;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="step1">
    <div class="envelope-icon" onclick="nextStep(2)">💌</div>
    <h1>မင်းအတွက် လျှို့ဝှက်စာတစ်စောင်</h1>
    <p>စာအိတ်လေးကို နှိပ်ပြီး ဖွင့်ကြည့်လိုက်ပါနော်...</p>
    <button class="btn-primary" onclick="nextStep(2)">စာဖွင့်မယ် ✨</button>
  </div>

  <div class="card hidden" id="step2">
    <div style="font-size: 50px; margin-bottom: 10px;">🥺💖</div>
    <h1>ကိုယ့်ကို ချစ်လားဟင်?</h1>
    <p>အမှန်အတိုင်း ဖြေရမယ်နော်...</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="celebrate()">အရမ်းချစ်တယ် ❤️</button>
      <button class="btn-secondary" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">မချစ်ဘူး 😜</button>
    </div>
  </div>

  <div class="card hidden" id="step3">
    <div style="font-size: 60px; margin-bottom: 10px;">🥰🎉</div>
    <h1>Yay! ကိုယ်လည်း အရမ်းချစ်တယ်!</h1>
    <p>
      မင်းရှိနေပေးလို့ ကိုယ့်ရဲ့ နေ့ရက်တိုင်းက အဓိပ္ပာယ်ရှိနေတာပါ။ 
      အမြဲတမ်း အတူတူ ရှိသွားကြမယ်နော် ❤️
    </p>
  </div>

  <script>
    function nextStep(step) {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.add('hidden');
      document.getElementById('step' + step).classList.remove('hidden');
    }

    function moveButton() {
      const noBtn = document.getElementById('noBtn');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function celebrate() {
      nextStep(3);
      setInterval(createHeart, 200);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      const icons = ['❤️', '💖', '💕', '🥰', '🌹'];
      heart.innerText = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 20 + 18) + 'px';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4500);
    }
  </script>

</body>
</html>
